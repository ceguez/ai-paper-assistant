[project]
name = "paper-assistant"
version = "1.0.0"
description = "Local research paper assistant: Proxy-Pointer retrieval and a native agent loop over a local SLM"
requires-python = ">=3.11,<3.14"
dependencies = [
  "starlette>=0.40",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.7",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
  "pymupdf4llm>=0.0.17",
]

[project.optional-dependencies]
# Better tables and layout; first run downloads layout models (~1-2 GB) and is slower.
docling = ["docling>=2.0"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
